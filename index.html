<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Croisières îles grecques 2027</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#14213d;--muted:#5c6b80;--line:#dde3ec;--accent:#0b6fb8;--good:#1a7f4b;--warn:#b35c00}
@media (prefers-color-scheme:dark){:root{--bg:#0f1622;--card:#172131;--ink:#e8eef7;--muted:#9aa8bb;--line:#2a3648;--accent:#5fb0ef;--good:#4cc28a;--warn:#f0a04b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:24px 16px 8px;max-width:1100px;margin:auto}
h1{margin:0 0 4px;font-size:1.6rem}
.sub{color:var(--muted)}
main{max-width:1100px;margin:auto;padding:8px 16px 40px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:12px 0 18px}
select,input{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.card h3{margin:0;font-size:1.05rem}
.price{font-size:1.4rem;font-weight:700;color:var(--accent)}
.tag{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);margin-right:4px}
.tag.good{color:var(--good);border-color:var(--good)}
.tag.warn{color:var(--warn);border-color:var(--warn)}
.muted{color:var(--muted);font-size:.9rem}
a{color:var(--accent)}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
#chart{width:100%;height:220px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:22px}
</style>
</head>
<body>
<header>
  <h1>Croisières îles grecques — sept./oct. 2027</h1>
  <div class="sub">2 adultes · budget max 3 000 € tout compris · vols depuis Paris si besoin</div>
</header>
<main>
  <div class="bar">
    <label>Veille du <select id="run"></select></label>
    <label>Trier <select id="sort"><option value="total">Prix total</option><option value="nuit">Prix / nuit</option><option value="date">Date de départ</option></select></label>
    <label><input type="checkbox" id="budget" checked> ≤ 3 000 € seulement</label>
    <span class="muted" id="meta"></span>
  </div>
  <div id="list" class="grid"></div>
  <h2 style="margin-top:28px;font-size:1.1rem">Évolution du meilleur prix</h2>
  <svg id="chart" viewBox="0 0 800 220" preserveAspectRatio="none"></svg>
</main>
<script>
const $=s=>document.querySelector(s);
const eur=n=>(n==null||isNaN(n))?'—':Math.round(n).toLocaleString('fr-FR')+' €';
let data=null;
async function j(u){const r=await fetch(u+'?t='+Date.now());if(!r.ok)throw new Error(u);return r.json()}
async function loadRuns(){
  let runs=[];try{runs=await j('data/runs/index.json')}catch(e){}
  const sel=$('#run');sel.innerHTML='<option value="latest">Dernière</option>'+runs.slice().reverse().map(d=>`<option value="${d}">${new Date(d).toLocaleDateString('fr-FR')}</option>`).join('');
  sel.onchange=()=>load(sel.value);
}
async function load(which){
  try{data=await j(which==='latest'?'data/latest.json':`data/runs/${which}.json`)}catch(e){data=null}
  render();
}
function render(){
  const list=$('#list');
  if(!data||!data.offres||!data.offres.length){list.innerHTML='<div class="empty">Pas encore de résultats — la première veille arrive demain matin à 7h.</div>';$('#meta').textContent='';return}
  $('#meta').textContent=`Mise à jour : ${new Date(data.date_veille).toLocaleString('fr-FR')} · ${data.offres.length} offres`;
  let o=data.offres.slice();
  if($('#budget').checked)o=o.filter(x=>x.prix_total_2pers<=3000);
  const k=$('#sort').value;
  o.sort((a,b)=>k==='total'?a.prix_total_2pers-b.prix_total_2pers:k==='nuit'?(a.prix_total_2pers/a.nuits)-(b.prix_total_2pers/b.nuits):String(a.date_depart).localeCompare(b.date_depart));
  list.innerHTML=o.map(x=>`<div class="card">
    <h3>${x.compagnie} — ${x.navire||''}</h3>
    <div class="muted">${x.itineraire||''}</div>
    <div class="price">${eur(x.prix_total_2pers)} <span class="muted" style="font-weight:400;font-size:.85rem">pour 2</span></div>
    <div class="muted">Croisière ${eur(x.prix_croisiere_2pers)} · Vols ${x.vol_inclus?eur(x.prix_vols_2pers):'non nécessaires'}</div>
    <div>Départ <b>${x.port_depart}</b> · ${x.date_depart?new Date(x.date_depart).toLocaleDateString('fr-FR'):''} · ${x.nuits} nuits · ${x.cabine||''}</div>
    <div>${x.prix_total_2pers<=3000?'<span class="tag good">Dans le budget</span>':'<span class="tag warn">Hors budget</span>'}${x.tendance?`<span class="tag">${x.tendance}</span>`:''}${(x.inclus||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
    ${x.remarque?`<div class="muted">${x.remarque}</div>`:''}
    <div>${x.lien?`<a href="${x.lien}" target="_blank" rel="noopener">Voir l'offre</a>`:''}${x.lien_vol?` · <a href="${x.lien_vol}" target="_blank" rel="noopener">Voir le vol</a>`:''}${x.lien_source?` · <a href="${x.lien_source}" target="_blank" rel="noopener" class="muted">Source du prix (site en anglais)</a>`:''}</div>
  </div>`).join('')||'<div class="empty">Aucune offre sous le budget dans cette veille.</div>';
}
async function chart(){
  let txt='';try{const r=await fetch('data/historique.csv?t='+Date.now());if(r.ok)txt=await r.text()}catch(e){}
  const rows=txt.trim().split('\n').slice(1).map(l=>l.split(',')).filter(r=>r.length>=2&&!isNaN(+r[1]));
  const svg=$('#chart');if(rows.length<2){svg.innerHTML='<text x="400" y="115" text-anchor="middle" fill="currentColor" opacity=".5">Historique disponible après 2 veilles</text>';return}
  const v=rows.map(r=>+r[1]),mn=Math.min(...v)*.95,mx=Math.max(...v)*1.05;
  const pts=v.map((y,i)=>`${30+i*(740/(v.length-1))},${200-(y-mn)/(mx-mn)*180}`).join(' ');
  svg.innerHTML=`<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>`+v.map((y,i)=>`<circle cx="${30+i*(740/(v.length-1))}" cy="${200-(y-mn)/(mx-mn)*180}" r="3" fill="var(--accent)"><title>${rows[i][0]} : ${eur(y)}</title></circle>`).join('');
}
$('#sort').onchange=render;$('#budget').onchange=render;
loadRuns();load('latest');chart();
</script>
</body>
</html>
